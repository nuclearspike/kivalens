# Dependabot config. Security alerts are always on; this adds a predictable
# version-update cadence so patches land in small batches instead of piling up
# into a big sweep. Grouping keeps the PR count low (one PR per ecosystem/group
# rather than one per package).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch/minor bumps are almost always safe -> one combined PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Majors are opt-in and reviewed individually, so keep them separate.
      major:
        update-types:
          - major
    ignore:
      # A Node major is a platform decision, not a dependency update. Production
      # runs Node 22.x (package.json engines; Heroku installs the newest 22.x at
      # build) while local development and the tests run Node 24, the major these
      # types describe, so an API newer than Node 22 type-checks here and fails
      # on Heroku.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is not installable here: typescript-eslint (8.70.1, the latest
      # on 2026-09-28) peers typescript ">=4.8.4 <6.1.0", so a TS 7 tree fails `npm ci`
      # with ERESOLVE — and Heroku installs with npm ci, so it would break the
      # deploy rather than just CI. Verified 2026-08-22: build and 371 tests pass
      # under TS 7, npm ci does not. Drop this entry once typescript-eslint
      # supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
